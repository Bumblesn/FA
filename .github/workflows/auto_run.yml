name: Auto Run Script

on:
  schedule:
    # 🧪 Test run at 00:22 AM IST (18:52 UTC)
    - cron: "8 19 * * *"
  workflow_dispatch:  # allows manual trigger for testing too

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run your script
        run: scheduler.py  # 👈 change to your actual filename
