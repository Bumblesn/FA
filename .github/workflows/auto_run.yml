name: Wipro Lighting ------------> Manager Report
on:
  schedule:
    - cron: '30 2 * * *'  # 2:30 AM UTC = 8:00 AM IST
  workflow_dispatch:
jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies (manual)
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl flatten_json xlsxwriter pytz
      - name: Create logs directory
        run: mkdir -p logs
      - name: Check day and run script (skip Sundays)
        run: |
          export TZ=Asia/Kolkata
          day=$(date +%u)
          echo "Current IST time:"
          date
          if [ "$day" -eq 7 ]; then
            echo "Today is Sunday. Skipping execution."
            exit 0
          fi
          echo "Running zone_wise_reports.py ..."
          for i in {1..5}; do
            echo "Attempt $i/5"
            if python zone_wise_reports.py; then
              echo "Success on attempt $i!"
              break
            fi
            if [ $i -lt 5 ]; then
              echo "Failed. Retrying in 5 minutes..."
              sleep 300
            fi
          done || (echo "All retries failed!" && exit 1)
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
      - name: Send failure email on all retries exhausted
        if: failure()
        run: |
          python - <<EOF
          from send_emails import send_failure_email
          send_failure_email(
              "GitHub Actions - All Retries Failed",
              "zone_wise_reports.py failed all 5 attempts. Check GitHub Actions logs.",
              ["vivek@flick2know.com"]
          )
          EOF
