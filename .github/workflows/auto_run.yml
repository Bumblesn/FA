name: Daily Zone Report (Skip Sundays)

on:
  schedule:
    # Run daily at 23:00 IST (17:30 UTC)
    - cron: '30 17 * * *'
  workflow_dispatch:  # Manual trigger option

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create logs directory
        run: mkdir -p logs

      - name: Check day and run script (skip Sundays)
        run: |
          day=$(date +%u)  # 1=Mon ... 7=Sun
          if [ "$day" -eq 7 ]; then
            echo "🟡 Today is Sunday. Skipping execution."
            exit 0
          fi

          echo "✅ Running zone_wise_reports.py ..."
          for i in {1..5}; do
            echo "Attempt $i/5"
            if python zone_wise_reports.py; then
              echo "✅ Success on attempt $i!"
              break
            fi
            if [ $i -lt 5 ]; then
              echo "❌ Failed. Retrying in 5 minutes..."
              sleep 300
            fi
          done || (echo "🚨 All retries failed!" && exit 1)

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
