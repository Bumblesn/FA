name: Daily Zone Report (Skip Sundays)

on:
  schedule:
    # Run daily at 22:51 UTC
    - cron: '51 22 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  run-report:
    runs-on: ubuntu-latest
    # Skip if today is Sunday (GitHub's day_of_week: 0=Sun, 1=Mon, etc.)
    if: github.event_name == 'schedule' && (format('ddd', github.event.schedule.timestamp) != 'Sun')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Match your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run zone_wise_reports.py (with retries)
        run: |
          for i in {1..5}; do
            echo "Attempt $i/5: Running zone_wise_reports.py"
            if python zone_wise_reports.py; then
              echo "Success on attempt $i!"
              break
            fi
            if [ $i -lt 5 ]; then
              echo "Failed. Retrying in 5 minutes..."
              sleep 300
            fi
          done || (echo "All retries failed!" && exit 1)

      - name: Upload logs as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7  # Keep logs for 1 week
